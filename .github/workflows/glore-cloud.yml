# GLORE cloud, without your PC: train LoRAs and render takes on RunPod from GitHub.
# Run it from the Actions tab (or `gh workflow run glore-cloud.yml -f command=status`).
# Needs these repo secrets (Settings -> Secrets and variables -> Actions):
#   GLORE_RUNPOD_API_KEY, GLORE_S3_ACCESS_KEY, GLORE_S3_SECRET, GLORE_VOLUME_ID, GLORE_DATACENTER
# optional: GLORE_GPU, GLORE_MONTHLY_LIMIT (USD, default 30)
name: GLORE cloud

on:
  workflow_dispatch:
    inputs:
      command:
        description: "status | check | train | generate | fetch | loras | stop"
        required: true
        default: status
      args:
        description: "Extra arguments, e.g. --variant xl_sft --epochs 200 (train) or --job <id> --wait (fetch)"
        required: false
        default: ""
      takes:
        description: "generate: JSON list of takes [{name, caption, lora?, scale?, seed, duration, bpm, key}]"
        required: false
        default: ""

concurrency:
  group: glore-cloud-${{ inputs.command }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: engine
    env:
      GLORE_RUNPOD_API_KEY: ${{ secrets.GLORE_RUNPOD_API_KEY }}
      GLORE_S3_ACCESS_KEY: ${{ secrets.GLORE_S3_ACCESS_KEY }}
      GLORE_S3_SECRET: ${{ secrets.GLORE_S3_SECRET }}
      GLORE_VOLUME_ID: ${{ secrets.GLORE_VOLUME_ID }}
      GLORE_DATACENTER: ${{ secrets.GLORE_DATACENTER }}
      GLORE_GPU: ${{ secrets.GLORE_GPU }}
      GLORE_MONTHLY_LIMIT: ${{ secrets.GLORE_MONTHLY_LIMIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the few packages the cloud CLI needs
        run: pip install --quiet "boto3>=1.35"
      - name: Run
        env:
          CMD: ${{ inputs.command }}
          ARGS: ${{ inputs.args }}
          TAKES: ${{ inputs.takes }}
        run: |
          set -eo pipefail
          export GLORE_HOME="$RUNNER_TEMP/glore-home"
          extra=()
          if [ "$CMD" = "generate" ]; then
            printf '%s' "$TAKES" > "$RUNNER_TEMP/takes.json"
            extra=(--takes "$RUNNER_TEMP/takes.json" --out "$GITHUB_WORKSPACE/out")
          fi
          if [ "$CMD" = "fetch" ]; then extra=(--out "$GITHUB_WORKSPACE/out"); fi
          # ARGS is split on spaces on purpose (flags only, no quoting needed)
          python -m glore_engine.cloud_cli "$CMD" "${extra[@]}" $ARGS | tee "$RUNNER_TEMP/output.txt"
      - name: Keep the takes
        if: always() && (inputs.command == 'generate' || inputs.command == 'fetch')
        uses: actions/upload-artifact@v4
        with:
          name: glore-takes
          path: out/
          if-no-files-found: ignore
          retention-days: 14
